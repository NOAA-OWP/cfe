name: Regression Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -B build -S . -DCMAKE_C_FLAGS='-Werror'

    - name: Build
      run: cmake --build build

    - name: Run integration tests (golden output comparison)
      run: |
        bash test/run_integration_test.sh \
          build/cfe_bmi_driver \
          configs/migrated_legacy_cat87.cf3 \
          forcings/cat87_01Dec2015.csv \
          test/golden/v2 \
          1e-10
        bash test/run_integration_test.sh \
          build/cfe_bmi_driver \
          configs/bmi_config_cat87_v3.cf3 \
          forcings/cat87_01Dec2015.csv \
          test/golden/v3 \
          1e-10
